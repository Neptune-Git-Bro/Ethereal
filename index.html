<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal's Collection | Premium Wholesale & Retail</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a2318;
            --primary-light: #133827;
            --accent: #d4af37;
            --accent-light: #f3e5ab;
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --border-color: #e2dfd8;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-title {
            font-family: 'Playfair Display', serif;
        }

        /* Top Notification Marquee Bar */
        .top-marquee {
            background-color: var(--primary);
            color: var(--accent-light);
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 500;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }

        .marquee-track span {
            margin-right: 60px;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Navigation Bar */
        header {
            background-color: rgba(250, 249, 246, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-btn {
            background-color: var(--primary);
            color: var(--accent-light) !important;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 600;
        }

        .nav-btn:hover {
            background-color: var(--primary-light);
        }

        /* Hamburger Menu for Mobile */
        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3rem;
            color: var(--primary);
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            color: var(--accent);
            font-style: italic;
        }

        .hero-content p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .hero-image-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(10, 35, 24, 0.08);
            border: 1px solid var(--border-color);
            text-align: center;
        }
